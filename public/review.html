<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rate Your Experience • Google Business Review Portal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --bg-gradient: radial-gradient(circle at 50% -10%, #3d1428 0%, #1c0813 50%, #0c0208 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --primary: #4a1329;
      --accent-gold: #d4af37;
      --accent-gold-hover: #b89324;
      --gold-gradient: linear-gradient(135deg, #fae596 0%, #d4af37 50%, #99730c 100%);
      --rose-gradient: linear-gradient(135deg, #7a2347 0%, #4a152d 100%);
      --rose-light: #fdf0f5;
      --rose-border: #f5d3e3;
      --surface: #ffffff;
      --surface-alt: #fdf8fa;
      --text-main: #1c1117;
      --text-muted: #6b5a64;
      --border: #eddce5;
      --star-active: #f5b014;
      --star-empty: #e5d8e0;
      --shadow-sm: 0 4px 14px rgba(74, 19, 41, 0.06);
      --shadow-md: 0 16px 40px rgba(74, 19, 41, 0.16);
      --shadow-lg: 0 30px 80px rgba(0, 0, 0, 0.45);
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 32px;
      --radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.18) 0%, rgba(122, 35, 71, 0.25) 50%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      min-height: 100vh;
      padding: 36px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 44px 38px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .cover-banner {
      background: linear-gradient(135deg, #3d1428 0%, #6e1c3e 50%, #2e0e1e 100%);
      height: 120px;
      margin: -44px -38px 28px -38px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 3px solid var(--accent-gold);
    }

    .cover-title {
      color: #ffffff;
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 1;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .brand-badge {
      width: 84px;
      height: 84px;
      border-radius: 26px;
      margin: -68px auto 16px;
      display: grid;
      place-items: center;
      background: var(--rose-gradient);
      color: #fff;
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 32px;
      letter-spacing: 1px;
      box-shadow: 0 12px 30px rgba(74, 19, 41, 0.4), 0 0 0 4px var(--accent-gold);
      position: relative;
      z-index: 2;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 34px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.2;
      margin-bottom: 6px;
      text-align: center;
    }

    h2 {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 2.5px;
      margin-bottom: 8px;
      text-align: center;
    }

    .muted {
      color: var(--text-muted);
      font-size: 15px;
      text-align: center;
    }

    .stars-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 24px 0 16px;
      background: linear-gradient(180deg, rgba(253, 248, 250, 0.9) 0%, rgba(255, 255, 255, 1) 100%);
      padding: 24px 20px;
      border-radius: var(--radius-md);
      border: 1px dashed var(--rose-border);
      box-shadow: var(--shadow-sm);
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .stars button {
      border: none;
      background: none;
      font-size: 52px;
      line-height: 1;
      color: var(--star-empty);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.08));
    }

    .stars button:hover,
    .stars button.on {
      color: var(--star-active);
      transform: scale(1.26) translateY(-5px);
      filter: drop-shadow(0 8px 16px rgba(245, 176, 20, 0.45));
    }

    .rating-badge {
      min-height: 40px;
      margin-top: 14px;
      padding: 8px 22px;
      border-radius: var(--radius-pill);
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(8px);
    }

    .rating-badge.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .rating-badge.r-5 {
      background: #dcfce7;
      color: #15803d;
      border: 1.5px solid #bbf7d0;
      box-shadow: 0 4px 14px rgba(21, 128, 61, 0.15);
    }

    .rating-badge.r-4 {
      background: #fef9c3;
      color: #a16207;
      border: 1.5px solid #fef08a;
      box-shadow: 0 4px 14px rgba(161, 98, 7, 0.15);
    }

    .rating-badge.r-3 {
      background: #ffedd5;
      color: #c2410c;
      border: 1.5px solid #fed7aa;
    }

    .rating-badge.r-2,
    .rating-badge.r-1 {
      background: #ffe4e6;
      color: #be123c;
      border: 1.5px solid #fecdd3;
    }

    .service-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .service-card-item {
      border: 1.5px solid var(--border);
      background: var(--surface-alt);
      border-radius: var(--radius-md);
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .service-card-item:hover {
      border-color: var(--accent-gold);
      transform: translateY(-2px);
    }

    .service-card-item.active {
      border-color: var(--accent-gold);
      background: var(--gold-gradient);
      color: #111;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.35);
      transform: scale(1.03);
    }

    .service-card-icon {
      font-size: 26px;
      margin-bottom: 2px;
      display: block;
    }

    .service-card-label {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
    }

    /* Ready-Made Preset Review Option Cards */
    .presets-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .preset-card {
      border: 1.5px solid var(--border);
      background: var(--surface-alt);
      padding: 14px 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .preset-card:hover {
      border-color: var(--accent-gold);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .preset-card.selected {
      border-color: var(--accent-gold);
      background: #fffdf5;
      border-width: 2px;
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.25);
    }

    .preset-card-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--primary);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preset-card-text {
      font-size: 13.5px;
      color: var(--text-main);
      line-height: 1.5;
    }

    .preset-select-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      background: var(--rose-light);
      color: var(--primary);
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--rose-border);
    }

    .preset-card.selected .preset-select-badge {
      background: var(--gold-gradient);
      color: #111;
      border-color: var(--accent-gold);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: none;
      border-radius: var(--radius-md);
      padding: 16px 28px;
      background: var(--rose-gradient);
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(74, 19, 41, 0.28);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(74, 19, 41, 0.38);
    }

    .btn-gold {
      background: var(--gold-gradient);
      color: #111111;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.38);
    }

    .btn-gold:hover {
      filter: brightness(1.06);
      box-shadow: 0 12px 30px rgba(212, 175, 55, 0.48);
    }

    .btn-block {
      width: 100%;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      color: var(--primary);
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-size: 14.5px;
      color: var(--text-main);
      background: var(--surface-alt);
      min-height: 100px;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.18);
      background: #ffffff;
    }

    .instruction-steps {
      background: #fdf8fa;
      border: 1.5px solid var(--rose-border);
      border-radius: var(--radius-md);
      padding: 20px;
      text-align: left;
      margin-bottom: 20px;
    }

    .step-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 12px;
    }

    .step-row:last-child {
      margin-bottom: 0;
    }

    .step-num {
      background: var(--rose-gradient);
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .step-text {
      font-size: 14.5px;
      color: var(--text-main);
      font-weight: 600;
      line-height: 1.4;
    }

    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .fade-in {
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 640px) {
      .card {
        padding: 28px 20px;
      }

      .cover-banner {
        margin: -28px -20px 24px -20px;
        height: 95px;
      }

      .cover-title {
        font-size: 18px;
      }

      h1 {
        font-size: 28px;
      }

      .stars button {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>
  <!-- Canvas for celebratory gold confetti burst -->
  <canvas id="confettiCanvas"></canvas>

  <main class="page">
    <button id="scanQrBtn" class="btn btn-gold btn-block" style="margin-bottom:12px;">📷 Scan QR to Choose
      Service</button>
    <div id="qrOverlay" class="hidden"
      style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;">
      <video id="qrVideo" autoplay playsinline style="width:80%;max-width:400px;"></video>
      <canvas id="qrCanvas" style="display:none;"></canvas>
      <button id="closeQrBtn" class="btn btn-gold" style="margin-top:12px;">Close</button>
    </div>
    <div class="container">

      <section class="card card-hero fade-in">

        <!-- Header Cover Banner -->
        <div class="cover-banner">
          <div class="cover-title" id="coverTitle">Google Verified Business</div>
        </div>

        <div class="brand-badge" id="brandBadge">⭐</div>
        <div class="subtitle" id="salonSub">Google Business Profile</div>
        <h1 id="mainTitle">How Was Your Experience?</h1>
        <p class="muted" id="mainDesc">Tap a star rating below to begin your review.</p>

        <!-- Step 1: Star Rating Container -->
        <div class="stars-container">
          <div id="stars" class="stars">
            <button data-r="1" title="1 Star - Unsatisfactory">★</button>
            <button data-r="2" title="2 Stars - Needs Improvement">★</button>
            <button data-r="3" title="3 Stars - Average">★</button>
            <button data-r="4" title="4 Stars - Very Good">★</button>
            <button data-r="5" title="5 Stars - Exceptional">★</button>
          </div>

          <div id="ratingBadge" class="rating-badge">Tap stars above</div>
        </div>

        <!-- Step 2: Service Selector & 10 Per-Service Preset Reviews -->
        <div id="detailsForm" class="hidden fade-in"
          style="text-align: left; margin-top: 24px; border-top: 1px solid var(--border); padding-top: 20px;">

          <!-- Dynamic Category Selector Cards -->
          <div class="form-group">
            <label id="serviceSelectLabel">Select Service / Topic 🏷️</label>
            <div id="serviceCardsGrid" class="service-cards-grid">
              <!-- Rendered dynamically per business category -->
            </div>
          </div>

          <!-- Category Ready-Made Review Preset Options -->
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <label style="margin:0;">Select A 5-Star Review Option (Writing Assistance) 🌟</label>
              <span id="presetCategoryLabel"
                style="font-size: 12px; font-weight: 700; color: var(--accent-gold); text-transform: uppercase;">Review Suggestions</span>
            </div>
            <div id="presetsContainer" class="presets-container">
              <!-- Rendered dynamically via Groq AI or clean manual notice -->
            </div>
          </div>

          <!-- Review Text Area (Auto-filled from Selected Preset, or Editable) -->
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label for="feedbackText">Selected Review Text 📝</label>
              <span id="charCount" style="font-size: 12px; color: var(--text-muted);">0 / 500</span>
            </div>
            <textarea id="feedbackText" maxlength="500"
              placeholder="Select a preset review above or type your custom feedback..."></textarea>
          </div>

          <!-- Direct Submit Button -->
          <button id="submitBtn" class="btn btn-gold btn-block">
            ⭐ Post 5-Star Review on Google Maps
          </button>
        </div>

        <!-- Step 3: Success Screen with Clear Paste Instructions -->
        <div id="successContainer" class="hidden fade-in" style="margin-top: 10px;">
          <!-- Rendered via JS -->
        </div>

      </section>

      <!-- Footer Info -->
      <footer style="text-align: center; color: rgba(255,255,255,0.7); font-size: 13px; margin-top: 10px;">
        <p id="footerText">Verified Google Business Profile</p>
      </footer>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    const API_BASE = (location.protocol.startsWith('http') && location.port === '3000')
      ? ''
      : `${location.protocol.startsWith('http') ? location.protocol : 'http:'}//${location.hostname || '127.0.0.1'}:3000`;

    let selectedRating = 0;
    let selectedService = '';
    let selectedPresetIndex = 0    let currentBusinessName = 'Business';

    const ratingDetails = {
      1: { text: "💔 Unsatisfactory", class: "r-1" },
      2: { text: "😐 Needs Improvement", class: "r-2" },
      3: { text: "😊 Good Visit", class: "r-3" },
      4: { text: "⭐ Wonderful Experience!", class: "r-4" },
      5: { text: "✨ Absolutely Stunning! Loved It 😍", class: "r-5" }
    };

    const stars = [...document.querySelectorAll('#stars button')];
    const ratingBadge = document.getElementById('ratingBadge');
    const detailsForm = document.getElementById('detailsForm');
    const feedbackText = document.getElementById('feedbackText');
    const charCount = document.getElementById('charCount');
    const presetsContainer = document.getElementById('presetsContainer');
    const submitBtn = document.getElementById('submitBtn');
    const successContainer = document.getElementById('successContainer');

    const pathParts = window.location.pathname.split('/').filter(Boolean);
    let currentTenantSlug = '';
    if (pathParts.includes('r') && pathParts[pathParts.indexOf('r') + 1]) {
      currentTenantSlug = pathParts[pathParts.indexOf('r') + 1];
    } else {
      const urlParams = new URLSearchParams(window.location.search);
      currentTenantSlug = urlParams.get('tenant') || urlParams.get('slug') || '';
    }
    let currentPlaceId = '';
    let dynamicCategories = [];
    let selectedCategoryIndex = 0;

    function getInitials(name) {
      if (!name) return 'GB';
      const clean = name.trim().replace(/[^a-zA-Z0-9\s]/g, '');
      const parts = clean.split(/\s+/).filter(Boolean);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function showNotFoundScreen() {
      document.title = 'Business Profile Not Found';
      if (document.getElementById('brandBadge')) document.getElementById('brandBadge').textContent = '404';
      if (document.getElementById('coverTitle')) document.getElementById('coverTitle').textContent = 'Profile Not Found';
      if (document.getElementById('salonSub')) document.getElementById('salonSub').textContent = 'Invalid Review Link';
      if (document.querySelector('footer p')) document.querySelector('footer p').textContent = 'Verified Google Business Profile Portal';

      const mainTitle = document.getElementById('mainTitle');
      const mainDesc = document.getElementById('mainDesc');
      const starsContainer = document.querySelector('.stars-container');
      const detailsForm = document.getElementById('detailsForm');

      if (mainTitle) mainTitle.textContent = 'Business Profile Not Found ❌';
      if (mainDesc) mainDesc.textContent = 'The requested review portal URL is invalid or no longer active. Please check your link or QR code and try again.';
      if (starsContainer) starsContainer.style.display = 'none';
      if (detailsForm) detailsForm.style.display = 'none';
    }

    function showPendingScreen(dataName) {
      const name = dataName || 'Business Profile';
      document.title = `${name} • Profile Setup in Progress`;
      const mainTitle = document.getElementById('mainTitle');
      const mainDesc = document.getElementById('mainDesc');
      const starsContainer = document.querySelector('.stars-container');
      const detailsForm = document.getElementById('detailsForm');

      if (mainTitle) mainTitle.textContent = 'PROFILE SETUP IN PROGRESS ⏳';
      if (mainDesc) mainDesc.textContent = 'Your Google Business Profile is currently being verified by our management team. Your review experience will become available after setup is completed.';
      if (starsContainer) starsContainer.style.display = 'none';
      if (detailsForm) detailsForm.style.display = 'none';
    }

    function showPausedScreen(dataName) {
      const name = dataName || 'Business Profile';
      document.title = `${name} • Profile Temporarily Unavailable`;
      const mainTitle = document.getElementById('mainTitle');
      const mainDesc = document.getElementById('mainDesc');
      const starsContainer = document.querySelector('.stars-container');
      const detailsForm = document.getElementById('detailsForm');

      if (mainTitle) mainTitle.textContent = 'Profile Temporarily Unavailable ⏸️';
      if (mainDesc) mainDesc.textContent = 'This business profile is currently suspended or temporarily paused by management.';
      if (starsContainer) starsContainer.style.display = 'none';
      if (detailsForm) detailsForm.style.display = 'none';
    }

    // Fetch Business Settings
    async function loadBusiness() {
      if (!currentTenantSlug) {
        showNotFoundScreen();
        return;
      }
      try {
        const res = await fetch(API_BASE + '/api/business?tenant=' + currentTenantSlug);
        if (!res.ok || res.status === 404) {
          showNotFoundScreen();
          return;
        }

        const data = await res.json();
        if (data.googleReviewUrl) {
          googleReviewUrl = String(data.googleReviewUrl).trim().replace(/,+$/, '');
        }
        if (data.googlePlaceId) {
          currentPlaceId = data.googlePlaceId;
        }
        if (data.name) {
          currentBusinessName = data.name;
          document.title = `Rate Your Experience • ${data.name}`;
          if (document.getElementById('coverTitle')) document.getElementById('coverTitle').textContent = data.name;
          if (document.getElementById('salonSub')) document.getElementById('salonSub').textContent = data.category ? `${data.name} • ${data.category}` : data.name;
          if (document.getElementById('brandBadge')) {
            document.getElementById('brandBadge').textContent = data.initials || getInitials(data.name);
          }
          if (document.querySelector('footer p')) {
            document.querySelector('footer p').textContent = `${data.name} • Verified Google Business Profile`;
          }
        }

        if (data.status === 'paused') {
          showPausedScreen(data.name);
          return;
        }

        if (data.status === 'pending_setup' || (!data.googlePlaceId && !data.googleReviewUrl)) {
          showPendingScreen(data.name);
          return;
        }

        // Active business: load dynamic category suggestions via Groq
        await loadReviewSuggestions();

      } catch (e) {
        console.error('Error fetching business settings', e);
        showNotFoundScreen();
      }
    }

    async function loadReviewSuggestions() {
      const serviceCardsGrid = document.getElementById('serviceCardsGrid');
      const presetsContainer = document.getElementById('presetsContainer');
      const presetCategoryLabel = document.getElementById('presetCategoryLabel');

      if (!presetsContainer) return;

      if (serviceCardsGrid) {
        serviceCardsGrid.innerHTML = `<div style="text-align:center; padding:12px; color:var(--text-muted); font-size:13px; grid-column: 1 / -1;">✨ Loading category review suggestions...</div>`;
      }
      presetsContainer.innerHTML = '';

      try {
        const res = await fetch(`${API_BASE}/api/reviews/suggestions?tenant=${currentTenantSlug}`);
        const data = await res.json();

        if (!data.ok || !data.categories || !Array.isArray(data.categories) || data.categories.length === 0) {
          const errMsg = data.error || 'AI review suggestions are temporarily unavailable. You can still write your feedback manually below.';
          if (serviceCardsGrid) serviceCardsGrid.innerHTML = '';
          presetsContainer.innerHTML = `
            <div style="padding: 12px 16px; background: rgba(212,175,55,0.08); border: 1px dashed var(--accent-gold); border-radius: 10px; font-size: 13px; color: var(--text-main); line-height: 1.5;">
              ℹ️ ${errMsg}
            </div>
          `;
          if (presetCategoryLabel) presetCategoryLabel.textContent = 'Custom Feedback';
          return;
        }

        dynamicCategories = data.categories;
        selectedCategoryIndex = 0;
        renderDynamicCategoryCards();
        renderDynamicPresets();

      } catch (err) {
        console.error('Error fetching review suggestions:', err);
        if (serviceCardsGrid) serviceCardsGrid.innerHTML = '';
        presetsContainer.innerHTML = `
          <div style="padding: 12px 16px; background: rgba(212,175,55,0.08); border: 1px dashed var(--accent-gold); border-radius: 10px; font-size: 13px; color: var(--text-main); line-height: 1.5;">
            ℹ️ AI review suggestions are temporarily unavailable. You can still write your feedback manually below.
          </div>
        `;
        if (presetCategoryLabel) presetCategoryLabel.textContent = 'Custom Feedback';
      }
    }

    function renderDynamicCategoryCards() {
      const grid = document.getElementById('serviceCardsGrid');
      if (!grid) return;

      grid.innerHTML = dynamicCategories.map((cat, idx) => `
        <div class="service-card-item ${idx === selectedCategoryIndex ? 'active' : ''}" data-index="${idx}">
          <span class="service-card-icon">${cat.icon || '⭐'}</span>
          <span class="service-card-label">${cat.name}</span>
        </div>
      `).join('');

      grid.querySelectorAll('.service-card-item').forEach(card => {
        card.addEventListener('click', () => {
          grid.querySelectorAll('.service-card-item').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          selectedCategoryIndex = parseInt(card.dataset.index, 10);
          renderDynamicPresets();
        });
      });
    }

    function renderDynamicPresets() {
      const presetsContainer = document.getElementById('presetsContainer');
      const presetCategoryLabel = document.getElementById('presetCategoryLabel');

      if (!presetsContainer) return;

      const currentCat = dynamicCategories[selectedCategoryIndex];
      if (!currentCat) return;

      if (presetCategoryLabel) {
        presetCategoryLabel.textContent = currentCat.name;
      }

      const presets = currentCat.presets || [];
      presetsContainer.innerHTML = presets.map((p, idx) => `
        <div class="preset-card ${idx === 0 ? 'selected' : ''}" data-idx="${idx}">
          <div class="preset-card-title">
            <span>${p.title}</span>
            <span class="preset-select-badge">${idx === 0 ? '✓ Selected' : 'Tap to Select'}</span>
          </div>
          <div class="preset-card-text">"${p.text}"</div>
        </div>
      `).join('');

      if (presets.length > 0 && !feedbackText.value.trim()) {
        feedbackText.value = presets[0].text;
        if (charCount) charCount.textContent = `${feedbackText.value.length} / 500`;
      }

      presetsContainer.querySelectorAll('.preset-card').forEach((card, idx) => {
        card.addEventListener('click', () => {
          presetsContainer.querySelectorAll('.preset-card').forEach(c => {
            c.classList.remove('selected');
            const badge = c.querySelector('.preset-select-badge');
            if (badge) badge.textContent = 'Tap to Select';
          });
          card.classList.add('selected');
          const badge = card.querySelector('.preset-select-badge');
          if (badge) badge.textContent = '✓ Selected';

          const preset = presets[idx];
          if (preset) {
            feedbackText.value = preset.text;
            if (charCount) charCount.textContent = `${feedbackText.value.length} / 500`;
          }
        });
      });
    }

    loadBusiness();

    // Update Stars Display
    function renderStars(r) {
      stars.forEach((s, idx) => {
        if (idx < r) {
          s.classList.add('on');
        } else {
          s.classList.remove('on');
        }
      });
    }

    function updateBadge(r) {
      if (!r) {
        ratingBadge.className = 'rating-badge';
        ratingBadge.textContent = 'Tap stars above';
        return;
      }
      const info = ratingDetails[r];
      ratingBadge.className = `rating-badge visible ${info.class}`;
      ratingBadge.textContent = info.text;
    }

    stars.forEach(s => {
      s.addEventListener('mouseenter', () => {
        const r = Number(s.dataset.r);
        renderStars(r);
        updateBadge(r);
      });

      s.addEventListener('mouseleave', () => {
        renderStars(selectedRating);
        updateBadge(selectedRating);
      });

      s.addEventListener('click', () => {
        selectedRating = Number(s.dataset.r);
        renderStars(selectedRating);
        updateBadge(selectedRating);

        detailsForm.classList.remove('hidden');

        if (selectedRating >= 4) {
          submitBtn.textContent = '⭐ Post 5-Star Review on Google Maps';
        } else {
          submitBtn.textContent = 'Submit Private Feedback to Management ❤️';
        }
      });
    });'hidden');

        // Initial render for active service
        renderPresetsForService(selectedService);

        if (selectedRating >= 4) {
          submitBtn.textContent = '⭐ Post 5-Star Review on Google Maps';
        } else {
          submitBtn.textContent = 'Submit Private Feedback to Management ❤️';
        }

        setTimeout(() => {
          detailsForm.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 100);
      });
    });

    // Auto-select 5-star rating by default on page load
    const initialFiveStar = document.querySelector('#stars button[data-r="5"]');
    if (initialFiveStar) {
      initialFiveStar.click();
    }

    // Character Counter
    feedbackText.addEventListener('input', () => {
      charCount.textContent = `${feedbackText.value.length} / 500`;
    });

    // Submit Action
    submitBtn.addEventListener('click', () => {
      if (selectedRating === 0) {
        alert('Please tap a star rating first.');
        return;
      }

      const userReviewText = feedbackText.value.trim();

      // Silent clipboard copy fallback if text exists
      if (selectedRating >= 4 && userReviewText) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(userReviewText);
          } else {
            const tempInput = document.createElement('textarea');
            tempInput.value = userReviewText;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
          }
        } catch (err) { }
      }

      // Open Google Review Write page (direct review dialog)
      if (selectedRating >= 4) {
        const writeUrl = (currentPlaceId && currentPlaceId.trim())
          ? `https://search.google.com/local/writereview?hl=en&placeid=${currentPlaceId.trim()}&rating=${selectedRating}&review=1`
          : googleReviewUrl;

        // Notify user about auto-copied text for zero-friction paste
        if (userReviewText) {
          alert('📋 Review Text Copied to Clipboard!\n\nWhen Google opens:\n1. Tap 5 Stars ⭐⭐⭐⭐⭐\n2. Long press / Ctrl+V to PASTE your review\n3. Click Post!');
        }

        window.open(writeUrl, '_blank');
      }

      // Save review asynchronously
      const payload = {
        tenantSlug: currentTenantSlug,
        rating: selectedRating,
        service: selectedService,
        feedback: userReviewText
      };

      fetch(API_BASE + '/api/reviews', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(err => {
        console.warn('API save notice:', err);
      });

      // Show success screen
      detailsForm.classList.add('hidden');
      document.querySelector('.stars-container').classList.add('hidden');
      document.getElementById('mainTitle').textContent = 'Thank You!';
      document.getElementById('mainDesc').textContent = 'We appreciate your valuable feedback!';

      successContainer.classList.remove('hidden');

      if (selectedRating >= 4) {
        launchConfetti();

        const escapedText = userReviewText.replace(/"/g, '&quot;');

        successContainer.innerHTML = `
          <div style="padding: 10px 0; text-align: center;">
            <div style="font-size: 54px; margin-bottom: 10px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));">✨ 🎉 💖</div>
            <h2 style="margin-bottom: 6px; color: var(--primary);">Review Text Copied to Clipboard!</h2>
            <p class="muted" style="margin-bottom: 16px; font-size: 15px;">
              Your 5-star review has been copied. When Google Maps opens, <b>Paste (Ctrl + V)</b> it into the review box!
            </p>

            <div style="background: var(--surface-alt); padding: 14px; border-radius: 12px; border: 1px dashed var(--border); margin-bottom: 20px; text-align: left; font-size: 14px; color: var(--text-main);">
              <b>📋 Selected Review Text:</b>
              <div id="selectedTextDisplay" style="margin-top: 6px; color: var(--primary); font-weight: 600;">${userReviewText || 'Exceptional service and wonderful staff!'}</div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 12px;">
              <button id="copyAgainBtn" onclick="copyTextToClipboard('${escapedText}')" class="btn btn-gold btn-block" style="font-size: 16px; padding: 14px;">
                📋 Re-Copy Review Text
              </button>
              <a id="gReviewDirectBtn" class="btn btn-secondary btn-block" href="${writeUrl}" target="_blank" rel="noopener" style="font-size: 16px; padding: 14px;">
                ⭐ Open Google Maps & Paste Review
              </a>
            </div>
          </div>
        `;
      } else {
        successContainer.innerHTML = `
          <div style="padding: 10px 0; text-align: center;">
            <div style="font-size: 52px; margin-bottom: 12px;">❤️ 🙏</div>
            <h2 style="margin-bottom: 10px; color: var(--primary);">Thank You For Your Feedback</h2>
            <p class="muted" style="margin-bottom: 24px; font-size: 15px; line-height: 1.5;">
              Your response has been privately submitted directly to <b>${currentBusinessName} Management</b> to help us improve your future experience.
            </p>
          </div>
        `;
      }
    });

    // Gold Confetti Burst
    function launchConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#d4af37', '#f3d478', '#7a2347', '#ffffff', '#e89bb5'];

      for (let i = 0; i < 110; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.75) * 18,
          size: Math.random() * 9 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 12,
          opacity: 1
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach(p => {
          if (p.opacity > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.35;
            p.rotation += p.vRot;
            p.opacity -= 0.012;

            ctx.save();
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }
        });

        if (active) {
          requestAnimationFrame(animate);
        }
      }
      animate();
    }
    // QR Code Scanning Logic
    const scanBtn = document.getElementById('scanQrBtn');
    const overlay = document.getElementById('qrOverlay');
    const video = document.getElementById('qrVideo');
    const canvas = document.getElementById('qrCanvas');
    const closeBtn = document.getElementById('closeQrBtn');
    let scanning = false;
    let videoStream = null;

    scanBtn.addEventListener('click', startQRScan);
    closeBtn.addEventListener('click', stopQRScan);

    function startQRScan() {
      overlay.classList.remove('hidden');
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => {
          video.srcObject = stream;
          videoStream = stream;
          scanning = true;
          requestAnimationFrame(tick);
        })
        .catch(err => {
          alert('Unable to access camera for QR scanning.');
          console.error(err);
        });
    }

    function stopQRScan() {
      scanning = false;
      overlay.classList.add('hidden');
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
        videoStream = null;
      }
    }

    function tick() {
      if (!scanning) return;
      if (video.readyState !== video.HAVE_ENOUGH_DATA) {
        requestAnimationFrame(tick);
        return;
      }
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, canvas.width, canvas.height);
      if (code && code.data) {
        const serviceName = code.data.trim();
        // Find matching service card
        const matchingCard = Array.from(serviceCards).find(c => c.dataset.service === serviceName);
        if (matchingCard) {
          matchingCard.click(); // triggers service selection and preset rendering
          // Auto-select 5-star rating
          const fiveStarBtn = document.querySelector('#stars button[data-r="5"]');
          if (fiveStarBtn) fiveStarBtn.click();
        } else {
          alert('Scanned QR does not match any service.');
        }
        stopQRScan();
      } else {
        requestAnimationFrame(tick);
      }
    }

  </script>
